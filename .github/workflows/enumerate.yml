name: Mirror reseed

on:
  schedule:
    - cron: "0 4 * * 0" # Sundays, before the daily 06:00 data refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  reseed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: data/mirror
          key: cf-mirror-${{ github.run_id }}
          restore-keys: |
            cf-mirror-

      - name: Reseed CurseForge mirror
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: pnpm mirror-cf --seed

      - name: Commit exact counts
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/cf-exact.json
            git commit -m "Reseed exact counts $(date -u +%F)"
            git pull --rebase
            git push
          fi
